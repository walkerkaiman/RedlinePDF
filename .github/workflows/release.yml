name: Build & Release

# Triggers on any tag starting with "v" (e.g. v0.1.0, v1.2.3)
# Push a tag to kick off a build:
#   git tag v0.1.0
#   git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Step 1: Create the draft release once ─────────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `RedlinePDF ${context.ref.replace('refs/tags/', '')}`,
              body: [
                `## RedlinePDF ${context.ref.replace('refs/tags/', '')}`,
                '',
                '### Downloads',
                '| Platform | File |',
                '|----------|------|',
                '| Ubuntu (Linux) | `RedlinePDF_*_amd64.deb` |',
                '| Windows | `RedlinePDF_*_x64-setup.exe` |',
                '| macOS (Universal) | `RedlinePDF_*_universal.dmg` |',
                '',
                '### Installing',
                '- **Ubuntu (Linux):** Install the `.deb` package, then run from your application menu.',
                '- **Windows:** Run the setup `.exe` and follow the wizard.',
                '- **macOS:** Open the `.dmg`, drag RedlinePDF to Applications.',
              ].join('\n'),
              draft: true,
              prerelease: false,
            });
            return data.id;

  # ── Step 2: Build & upload assets (runs in parallel after release exists) ──
  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            rust-targets: x86_64-unknown-linux-gnu
            args: ''
            deps: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          - platform: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            args: '--target x86_64-pc-windows-msvc'
            deps: ''
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: '--target universal-apple-darwin'
            deps: ''

    runs-on: ${{ matrix.platform }}

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Node.js ─────────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Keep the shipped version aligned with this tag (deb filename + in-app __APP_VERSION__).
      # Plain variable — no bash-isms, so it works on Windows PowerShell too. Script strips a leading 'v'.
      - name: Sync app version to release tag
        run: node scripts/sync-release-version.mjs "$GITHUB_REF_NAME"

      - name: Install frontend dependencies
        run: npm install

      # ── Linux dependencies ──────────────────────────────────────────────────
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # ── Rust ────────────────────────────────────────────────────────────────
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # ── Build & upload to the pre-created release ────────────────────────────
      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

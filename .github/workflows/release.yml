name: Build & Release

# Triggers on any tag starting with "v" (e.g. v0.1.0, v1.2.3)
# Push a tag to kick off a build:
#   git tag v0.1.0
#   git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'
            rust-target: x86_64-pc-windows-msvc
          - platform: macos-latest
            args: '--target aarch64-apple-darwin --target x86_64-apple-darwin'
            rust-target: ''   # handled individually below

    runs-on: ${{ matrix.platform }}

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Node.js ─────────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm install

      # ── Rust ────────────────────────────────────────────────────────────────
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-pc-windows-msvc' }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # ── macOS: build universal binary (Apple Silicon + Intel) ───────────────
      - name: Build (macOS universal)
        if: matrix.platform == 'macos-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'RedlinePDF ${{ github.ref_name }}'
          releaseBody: |
            ## RedlinePDF ${{ github.ref_name }}

            ### Downloads
            | Platform | File |
            |----------|------|
            | Windows | `RedlinePDF_*_x64-setup.exe` |
            | macOS (Universal) | `RedlinePDF_*_universal.dmg` |

            ### Installing
            - **Windows:** Run the setup `.exe` and follow the wizard.
            - **macOS:** Open the `.dmg`, drag RedlinePDF to Applications.
          releaseDraft: true
          prerelease: false
          args: '--target universal-apple-darwin'

      # ── Windows ─────────────────────────────────────────────────────────────
      - name: Build (Windows)
        if: matrix.platform == 'windows-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'RedlinePDF ${{ github.ref_name }}'
          releaseBody: |
            ## RedlinePDF ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: '--target x86_64-pc-windows-msvc'
